
name: Build TELE-NEW-APP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o TELE-NEW-APP-main.zip
          cd TELE-NEW-APP-main
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: TELE-NEW-APP-main
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TELE-NEW-APP-APK
          path: TELE-NEW-APP-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
