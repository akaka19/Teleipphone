
name: AT-FIL Telephone - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found in: $PROJECT_DIR"

      - name: Verify Android files
        run: |
          test -f "${{ steps.project.outputs.dir }}/app/build.gradle.kts"
          test -f "${{ steps.project.outputs.dir }}/app/src/main/AndroidManifest.xml"

      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-FIL-Telephone-Neuf-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
