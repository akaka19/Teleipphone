
name: Build AT-FIL Green

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e

          if ! find . -name settings.gradle -o -name settings.gradle.kts | grep -q .; then
            ZIP_FILE="$(find . -maxdepth 3 -name '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "Android project not found"
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          fi

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR="$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate Android project"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-FIL-Green-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
