
name: Build AT-FIL Téléphone APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            mkdir -p _android_source
            unzip -oq "$ZIP_FILE" -d _android_source

            PROJECT_DIR="$(find _android_source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android project or app/build.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Verify APK exists
        run: test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AT-FIL-Telephone-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
