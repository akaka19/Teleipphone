name: Build AT-FIL Green Glass

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            find . -type f \\
              \( -name settings.gradle.kts -o -name settings.gradle \) \\
              -not -path './.git/*' \\
              -print -quit | xargs -r dirname
          }

          PROJECT_DIR="$(find_project)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -name '*.zip' -not -path './.git/*' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or ZIP file found. Upload the project files or the project ZIP to the repository."
              exit 1
            fi

            mkdir -p _extracted_project
            unzip -oq "$ZIP_FILE" -d _extracted_project
            PROJECT_DIR="$(find _extracted_project -type f \\ \( -name settings.gradle.kts -o -name settings.gradle \) \\ -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" -a ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Gradle settings or app module not found. Check the ZIP folder structure."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-FIL-Green-Glass-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
