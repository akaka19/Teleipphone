
name: Build AT-FIL Green Glass

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path './.git/*' -print)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 4 -type f -name '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or ZIP file found."
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted

            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found, including inside ZIP."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: The Android app folder was not found in $PROJECT_DIR"
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-FIL-Green-Glass-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
